<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>门口机</title>
<style>
  :root {
    --bg: #0e1013; --panel: #171a20; --panel-2: #21252d; --panel-3: #2a2f39; --text: #e9ebf0; --muted: #8d93a1;
    --line: #2a2f3a; --accent: #4f8cff; --ok: #2fbf71; --danger: #ff5b57; --warn: #f5b942;
    --shadow: 0 12px 36px rgba(0,0,0,.42);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f2f3f6; --panel: #ffffff; --panel-2: #eceef3; --panel-3: #e1e4eb; --text: #15181f; --muted: #6b7280;
      --line: #e1e4ea; --shadow: 0 12px 36px rgba(20,30,60,.12);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Inter, Roboto, sans-serif;
    display: flex; flex-direction: column; min-height: 100dvh; -webkit-tap-highlight-color: transparent;
  }
  svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- header ---- */
  header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; padding-top: max(12px, env(safe-area-inset-top)); }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 11px; border-radius: 999px; background: var(--panel-2); color: var(--muted); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .pill.ringing .dot { background: var(--warn); animation: pulse 1s infinite; }
  .pill.live .dot { background: var(--ok); }
  .pill.offline .dot { background: var(--danger); }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: .5; } }
  .spacer { flex: 1; }
  button.icon { background: transparent; border: 0; color: var(--muted); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: grid; place-items: center; }
  button.icon:hover { background: var(--panel-2); color: var(--text); }
  button.icon svg { width: 20px; height: 20px; }

  /* ---- stage ---- */
  main { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 0 18px 12px; max-width: 1000px; width: 100%; margin: 0 auto; }
  .stage { position: relative; background: #000; border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); aspect-ratio: 16 / 10; max-height: 64dvh; }
  .stage > img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .tag { position: absolute; padding: 5px 10px; border-radius: 9px; font-size: 12px; color: #fff; background: rgba(0,0,0,.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .tag.badge { left: 14px; top: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .tag.badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .tag.badge.live i { background: var(--ok); }
  .tag.badge.ringing i { background: var(--warn); animation: pulse 1s infinite; }
  .tag.peer { right: 14px; top: 14px; font-variant-numeric: tabular-nums; }
  .pip { position: absolute; right: 14px; bottom: 14px; width: 28%; max-width: 210px; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid rgba(255,255,255,.28); box-shadow: 0 6px 18px rgba(0,0,0,.4); }
  .pip video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }

  /* ---- toolbar (meeting style) ---- */
  .bar { display: flex; justify-content: center; align-items: flex-start; gap: 18px; flex-wrap: wrap; padding: 4px 0 2px; }
  .group { display: flex; gap: 14px; align-items: flex-start; }
  .divider { width: 1px; height: 44px; background: var(--line); margin: 6px 2px 0; align-self: flex-start; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 64px; }
  .item .lbl { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .split { position: relative; display: flex; align-items: center; }
  .rb { width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--panel-2); color: var(--text); display: grid; place-items: center; cursor: pointer; transition: transform .08s ease, background .15s ease, opacity .15s ease; }
  .rb:hover { background: var(--panel-3); }
  .rb:active { transform: scale(.95); }
  .rb[disabled] { opacity: .32; cursor: not-allowed; transform: none; }
  .rb svg { width: 24px; height: 24px; }
  .rb .off-icon { display: none; }
  .split.off .rb:not([disabled]) { background: rgba(255,91,87,.16); color: var(--danger); }
  .split.off .rb .on-icon { display: none; }
  .split.off .rb .off-icon { display: block; }
  .rb.call { background: var(--ok); color: #fff; }
  .rb.end { background: var(--danger); color: #fff; }
  .rb.unlock { background: var(--accent); color: #fff; }
  .rb.call:hover { filter: brightness(1.08); } .rb.end:hover { filter: brightness(1.08); } .rb.unlock:hover { filter: brightness(1.08); }
  .chev { width: 22px; height: 30px; margin-left: 2px; border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: 8px; display: grid; place-items: center; }
  .chev:hover { background: var(--panel-2); color: var(--text); }
  .chev svg { width: 14px; height: 14px; stroke-width: 2.4; }
  .chev[disabled] { opacity: .32; cursor: not-allowed; }

  /* ---- popover menus ---- */
  .menu { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%); min-width: 232px; max-width: calc(100vw - 24px); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; z-index: 30; }
  .menu h4 { margin: 8px 10px 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .menu .opt { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; cursor: pointer; font-size: 14px; user-select: none; }
  .menu .opt:hover { background: var(--panel-2); }
  .menu .opt .check { width: 16px; height: 16px; color: var(--accent); visibility: hidden; flex: none; }
  .menu .opt.sel .check { visibility: visible; }
  .menu .opt.dis { opacity: .4; cursor: default; }
  .menu .opt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu .empty { padding: 8px 10px; color: var(--muted); font-size: 13px; }
  .menu .range { display: flex; align-items: center; gap: 10px; padding: 8px 10px 10px; }
  .menu .range svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
  .menu input[type=range] { flex: 1; accent-color: var(--accent); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }

  /* ---- footer / log ---- */
  footer { padding: 0 18px 14px; padding-bottom: max(14px, env(safe-area-inset-bottom)); max-width: 1000px; width: 100%; margin: 0 auto; }
  .txt { background: transparent; border: 0; color: var(--muted); font: inherit; font-size: 12.5px; cursor: pointer; padding: 6px 8px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; }
  .txt:hover { background: var(--panel-2); color: var(--text); }
  .txt svg { width: 14px; height: 14px; }
  .log { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; max-height: 24dvh; overflow: auto; font-size: 13px; margin-top: 6px; }
  .log div { display: flex; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .log div:last-child { border-bottom: 0; }
  .log time { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }

  /* ---- toast / dialogs ---- */
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 10px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 14px; opacity: 0; transition: opacity .2s ease; pointer-events: none; z-index: 50; max-width: 92vw; }
  .toast.show { opacity: 1; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 18px; padding: 22px; width: min(92vw, 400px); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0,0,0,.5); backdrop-filter: blur(2px); }
  dialog h2 { margin: 0 0 14px; font-size: 16px; }
  dialog label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 6px; }
  dialog input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font: inherit; }
  dialog input::placeholder { color: var(--muted); }
  dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  dialog button { padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); cursor: pointer; font: inherit; }
  dialog button.primary { background: var(--ok); border-color: var(--ok); color: #fff; }
  dialog button.primary:disabled { opacity: .4; cursor: not-allowed; }
  .hint { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  dialog.sheet .dial-input { font: 500 30px/1.2 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .1em; text-align: center; padding: 14px; border-radius: 14px; }
  dialog.sheet .preview { text-align: center; font-variant-numeric: tabular-nums; min-height: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; justify-content: center; }
  .chip { padding: 6px 12px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); font-size: 13px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .chip:hover { background: var(--panel-3); }
  @media (max-width: 560px) {
    dialog.sheet { margin: auto auto 0; width: 100vw; max-width: 100vw; border-radius: 20px 20px 0 0; padding-bottom: max(22px, env(safe-area-inset-bottom)); }
    .bar { gap: 12px; } .group { gap: 10px; } .item { min-width: 58px; } .rb { width: 52px; height: 52px; }
    .divider { display: none; }
    .stage { border-radius: 16px; aspect-ratio: 4 / 3; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">门口机</h1>
  <span class="pill" id="status"><span class="dot"></span><span id="statusText">连接中</span></span>
  <span class="spacer"></span>
  <button class="icon" id="settingsBtn" title="设置" aria-label="设置">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main>
  <section class="stage">
    <img id="video" alt="画面">
    <span class="tag badge" id="badge"><i></i><span id="badgeText">离线</span></span>
    <span class="tag peer" id="peer" hidden></span>
    <div class="pip" id="pip" hidden></div>
  </section>

  <section class="bar">
    <!-- media: mic / camera / speaker, each with a settings dropdown -->
    <div class="group">
      <div class="item">
        <div class="split" id="micSplit">
          <button class="rb" id="micBtn" aria-label="麦克风" disabled>
            <svg class="on-icon" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>
            <svg class="off-icon" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/><path d="M3 3l18 18"/></svg>
          </button>
          <button class="chev" data-menu="micMenu" aria-label="麦克风选项"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
          <div class="menu" id="micMenu" hidden></div>
        </div>
        <span class="lbl">麦克风</span>
      </div>
      <div class="item">
        <div class="split" id="camSplit">
          <button class="rb" id="camBtn" aria-label="摄像头" disabled>
            <svg class="on-icon" viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>
            <svg class="off-icon" viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 10l5-3v10l-5-3z"/><path d="M3 3l18 18"/></svg>
          </button>
          <button class="chev" data-menu="camMenu" aria-label="摄像头选项"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
          <div class="menu" id="camMenu" hidden></div>
        </div>
        <span class="lbl">摄像头</span>
      </div>
      <div class="item">
        <div class="split" id="spkSplit">
          <button class="rb" id="spkBtn" aria-label="喇叭">
            <svg class="on-icon" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>
            <svg class="off-icon" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
          </button>
          <button class="chev" data-menu="spkMenu" aria-label="喇叭选项"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
          <div class="menu" id="spkMenu" hidden></div>
        </div>
        <span class="lbl">喇叭</span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- contextual primary actions -->
    <div class="group" id="actIdle">
      <div class="item">
        <button class="rb call" id="dialBtn" aria-label="拨号" disabled><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.7a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.8 2.1z"/></svg></button>
        <span class="lbl">拨号</span>
      </div>
      <div class="item">
        <div class="split">
          <button class="rb" id="viewBtn" data-menu="viewMenu" aria-label="查看摄像头" disabled><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <div class="menu" id="viewMenu" hidden></div>
        </div>
        <span class="lbl">查看</span>
      </div>
      <div class="item">
        <button class="rb" id="elevatorBtn" aria-label="叫电梯" disabled><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 15V9m0 0-2.5 2.5M9 9l2.5 2.5M15 9v6m0 0 2.5-2.5M15 15l-2.5-2.5"/></svg></button>
        <span class="lbl">电梯</span>
      </div>
      <div class="item">
        <button class="rb unlock" id="unlockIdleBtn" aria-label="开锁" disabled><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg></button>
        <span class="lbl">开锁</span>
      </div>
    </div>

    <div class="group" id="actRinging" hidden>
      <div class="item">
        <button class="rb call" id="answerBtn" aria-label="接听"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.7a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.8 2.1z"/></svg></button>
        <span class="lbl">接听</span>
      </div>
      <div class="item">
        <button class="rb unlock" id="unlockRingBtn" aria-label="开锁"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg></button>
        <span class="lbl">开锁</span>
      </div>
      <div class="item">
        <button class="rb end" id="rejectBtn" aria-label="挂断"><svg viewBox="0 0 24 24" style="transform:rotate(135deg)"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.7a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.8 2.1z"/></svg></button>
        <span class="lbl">挂断</span>
      </div>
    </div>

    <div class="group" id="actDoor" hidden>
      <div class="item">
        <button class="rb unlock" id="unlockBtn" aria-label="开锁"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg></button>
        <span class="lbl">开锁</span>
      </div>
      <div class="item">
        <button class="rb end" id="hangupBtn" aria-label="挂断"><svg viewBox="0 0 24 24" style="transform:rotate(135deg)"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.7a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.8 2.1z"/></svg></button>
        <span class="lbl">挂断</span>
      </div>
    </div>

    <div class="group" id="actCalling" hidden>
      <div class="item">
        <button class="rb end" id="dialHangupBtn" aria-label="挂断"><svg viewBox="0 0 24 24" style="transform:rotate(135deg)"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.7a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.8 2.1z"/></svg></button>
        <span class="lbl">挂断</span>
      </div>
    </div>

    <div class="group" id="actMonitor" hidden>
      <div class="item">
        <button class="rb end" id="viewStopBtn" aria-label="停止查看"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
        <span class="lbl">停止查看</span>
      </div>
    </div>
  </section>
</main>

<footer>
  <button class="txt" id="logToggle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 3"/></svg>活动记录</button>
  <section class="log" id="log" hidden></section>
</footer>

<div class="toast" id="toast"></div>

<dialog id="dialSheet" class="sheet">
  <h2>拨号</h2>
  <input id="dialInput" class="dial-input" placeholder="室内机号码" autocomplete="off" inputmode="numeric" enterkeyhint="call">
  <p class="hint preview" id="dialPreview">输入短号，如 3003</p>
  <div class="chips" id="recent"></div>
  <div class="row">
    <button id="dialCancel">取消</button>
    <button class="primary" id="dialGo" disabled>呼叫</button>
  </div>
</dialog>

<dialog id="settings">
  <h2>连接设置</h2>
  <label for="tokenInput">访问令牌（Agent 的 bearer token）</label>
  <input id="tokenInput" placeholder="留空表示 Agent 未开启鉴权" autocomplete="off">
  <p class="hint" id="apiHint"></p>
  <div class="row">
    <button id="settingsCancel">取消</button>
    <button class="primary" id="settingsSave">保存</button>
  </div>
</dialog>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const state = {
    phase: 'idle', owner: 'none', online: false, monitoring: null, calling: null, callLabel: '', connected: false,
    peer: '', deviceId: '', token: localStorage.getItem('padToken') || '',
  };
  const el = {

    el.recent.replaceChildren(...recent().map((n) => { const c = document.createElement('button'); c.type = 'button'; c.className = 'chip'; c.textContent = n; c.onclick = () => { el.dialInput.value = n; renderDial(); el.dialInput.focus(); }; return c; }));
  }
  el.dial.onclick = () => { el.dialInput.value = ''; renderDial(); el.dialSheet.showModal(); setTimeout(() => el.dialInput.focus(), 50); };
  el.dialCancel.onclick = () => el.dialSheet.close();
  el.dialInput.oninput = renderDial;
  el.dialInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !el.dialGo.disabled) { e.preventDefault(); el.dialGo.click(); } });
  el.dialGo.onclick = async () => {
    const value = el.dialInput.value.trim(); if (!value) return;
    const id = fullStationId(value);
    try {
      const resp = await fetch(base + '/v1/dial', { method: 'POST', headers: jsonHeaders(), body: JSON.stringify({ callee_id: id }) });
      if (resp.status === 401) { el.dialSheet.close(); openSettings('令牌无效'); return; }
      if (resp.ok) { remember(value); el.dialSheet.close(); state.calling = id; state.callLabel = value; state.connected = false; render(); startMedia(); startTalk(); logLine('拨号 ' + id); }
      else { const r = await resp.json().catch(() => ({})); toast('拨号失败：' + (r.error || resp.status)); }
    } catch (e) { toast('拨号失败'); }
  };
  el.dialHangup.onclick = async () => {
    try { await fetch(base + '/v1/dial/hangup', { method: 'POST', headers: headers() }); } catch (e) {}
    state.calling = null; state.callLabel = ''; state.connected = false; rest(); render(); logLine('挂断通话');
  };

  // ---------- Events (SSE) ----------
  let source = null;
  function applyState(s) {
    state.phase = s.phase; state.owner = s.owner; state.online = true;
    if (s.phase !== 'idle' && s.door_id) state.peer = s.door_id;
    if (s.phase === 'idle') { stopRing(); if (!state.calling && !state.monitoring) { stopMedia(); showPlaceholder(); } }
    else { startMedia(); if (s.phase === 'ringing') startRing(); else stopRing(); }
    render();
  }
  function connectEvents() {
    if (source) source.close();
    source = new EventSource(withToken('/v1/events'));
    source.onopen = () => { state.online = true; render(); };
    source.onerror = () => { state.online = false; render(); };
    const on = (name, fn) => source.addEventListener(name, (e) => fn(e.data ? JSON.parse(e.data) : {}));
    on('snapshot', (ev) => applyState(ev.state));
    on('call_started', (ev) => { logLine('门口 ' + ev.door_id + ' 呼叫'); state.peer = ev.door_id || ''; state.phase = 'ringing'; state.owner = 'none'; state.online = true; render(); startMedia(); startRing(); });
    on('pad_answered', () => { logLine('室内机已接听'); state.phase = 'connected'; state.owner = 'pad'; render(); stopRing(); });
    on('remote_answered', () => { state.phase = 'connected'; state.owner = 'remote'; render(); stopRing(); });
    on('unlocked', (ev) => logLine(ev.by === 'remote' ? '已开锁' : '室内机开锁'));
    on('call_ended', (ev) => { logLine('通话结束（' + ev.reason + '）'); state.phase = 'idle'; state.owner = 'none'; state.peer = ''; stopRing(); rest(); render(); });
    on('agent_error', (ev) => logLine('Agent 错误：' + ev.message));
    on('monitor_started', (ev) => { state.monitoring = ev.camera_id; render(); startMedia(); logLine('查看 ' + ev.camera_id); });
    on('monitor_stopped', (ev) => { if (state.monitoring) { state.monitoring = null; rest(); render(); } logLine('查看结束（' + ev.reason + '）'); });
    on('elevator_called', () => logLine('电梯已呼叫'));
    on('dialing', (ev) => { if (state.calling !== ev.callee_id) { state.calling = ev.callee_id; state.callLabel = ''; state.connected = false; render(); startMedia(); startTalk(); logLine('拨号 ' + ev.callee_id); } });
    on('call_connected', (ev) => { state.connected = true; render(); logLine('已接通 ' + ev.callee_id); });
    on('call_hung_up', (ev) => { if (state.calling) { state.calling = null; state.callLabel = ''; state.connected = false; rest(); render(); } logLine('通话结束（' + ev.reason + '）'); });
  }
  async function probe() {
    try {
      const resp = await fetch(base + '/v1/state', { headers: headers() });
      if (resp.status === 401) { openSettings('需要访问令牌'); return false; }
      const s = await resp.json(); if (s.room_id) state.deviceId = s.room_id;
      el.title.textContent = s.room_id ? '门口机 · ' + s.room_id : '门口机';
      applyState(s);
      return true;
    } catch (e) { state.online = false; render(); return false; }
  }

  // ---------- Settings ----------
  function openSettings(hint) { el.tokenInput.value = state.token; el.apiHint.textContent = hint || ('Agent: ' + base); el.settings.showModal(); }
  $('settingsBtn').onclick = () => openSettings();
  $('settingsCancel').onclick = () => el.settings.close();
  $('settingsSave').onclick = async () => { state.token = el.tokenInput.value.trim(); localStorage.setItem('padToken', state.token); el.settings.close(); if (await probe()) connectEvents(); };

  // ---------- Server-provided UI config ----------
  async function loadUiConfig() {
    try {
      const r = await fetch(base + '/v1/ui-config', { headers: { 'Accept': 'application/json' } });
      if (!r.ok) return;
      const c = await r.json();
      if (Array.isArray(c.camera_resolutions) && c.camera_resolutions.length) { ui.res = c.camera_resolutions.map(String); ui.resDef = String(c.camera_resolution_default || ''); }
      if (Array.isArray(c.camera_fps) && c.camera_fps.length) { ui.fps = c.camera_fps.map(Number); ui.fpsDef = Number(c.camera_fps_default) || ui.fps[0]; }
    } catch (e) {}
  }

  showPlaceholder();
  render();
  loadUiConfig();
  probe().then((ok) => { if (ok) connectEvents(); else if (!el.settings.open) setTimeout(() => probe().then((ok2) => ok2 && connectEvents()), 3000); });
})();
</script>
</body>
</html>
