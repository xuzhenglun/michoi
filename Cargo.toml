[package]
name = "michoi"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "PENGUIN0 intercom Agent: capture, replay, control plane"
license = "MIT OR Apache-2.0"

[features]
default = []
linux-packet = ["dep:libc"]
# Apple HomeKit (HAP over IP) controller built on the vendored hap crate.
# Control-only for P0 (Lock, elevator Switch, Doorbell notification); the
# camera/RTP half is added later and pulls extra deps then.
hap = ["dep:hap", "dep:if-addrs"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "io-util"] }
tokio-tungstenite = "0.27"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

hap = { path = "vendor/hap", optional = true }
if-addrs = { version = "0.6", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[profile.release]
opt-level = "z"
debug = 0
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
incremental = false
