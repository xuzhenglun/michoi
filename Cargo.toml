[package]
name = "pad-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "PENGUIN0 intercom Agent: capture, replay, control plane"
license = "MIT OR Apache-2.0"

[features]
default = []
linux-packet = ["dep:libc"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "io-util"] }
tokio-tungstenite = "0.27"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }
# 32-bit MIPS (mipsel router build) has no native AtomicU64.
portable-atomic = "1"

[profile.release]
opt-level = "z"
debug = 0
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
incremental = false
