[intercom]
# pad = this process IS the Pad (UDP endpoint, cross-platform).
# tap = a physical Pad stays; tap the bridge and arbitrate (Linux router).
mode = "tap"
# The one identity: the Pad's room station id (who I am / whom I stand in for).
device_id = "S00000000000"
# LAN for the UDP 10008 discovery broadcast (optional; 255.255.255.255 if unset).
subnet = "192.168.124.0/24"

# tap mode: the bridge to capture and its member ports (for nft silencing).
# Determine the ports by swapping cables or observing switch counters.
bridge_interface = "br-lan"
door_interface = "eth0.2"
pad_interface = "eth0.1"

# pad mode: UDP control endpoint to bind.
pad_listen = "0.0.0.0:10000"

# Everything below is optional. Unset = discovered (UDP 10008) or learned from
# the door's discovery exchange / the first call, then pinned (trust on first
# use). Set them to pin up front instead.
# door_id = "M00000000000"
# door_ip = "192.168.124.2"
# room_ip = "192.168.124.61"
# door_mac = "00:00:00:00:00:02"
# pad_mac = "00:00:00:00:00:3d"
control_port = 10000
discovery_port = 10008
# Door cameras offered for on-demand viewing (the provisioned roster; the
# protocol has no discovery for these). Reachable ones show video via
# GET /v1/cameras + POST /v1/monitor. Example entrance doors:
# cameras = ["M00000000000", "M00000000001", "M00000000002"]

[agent]
# HTTP control plane (REST + Server-Sent Events), see docs/openapi.yaml.
# Use 0.0.0.0 only with a bearer token on a trusted network.
http_listen = "127.0.0.1:8080"
# Bearer token required on every control-plane request; empty = no auth (development only).
token = ""
# Serve Swagger UI at /swagger for manual testing.
swagger = false
# Serve the built-in browser Pad at / : a cross-platform fallback UI when no
# Matter/HAP backend is deployed. Set false for headless deployments.
web_ui = true

[media]
# lite never decodes untrusted JPEG on the MT7628.
engine = "lite"
fps = 8
width = 320
height = 240
ffmpeg = "ffmpeg"
# Pre-roll buffer of door video/audio kept in the Agent's memory (seconds, 0 = off) and its byte cap.
history_secs = 5
history_max_kib = 2048

[coexistence]
mode = "manual"
nfqueue = 30
owner_timeout_ms = 2000

[security]
unlock_cooldown_ms = 1000
# true = only the remote owner of an answered call may unlock; false = any time (Pad-like).
unlock_requires_answer = false
virtual_unlock_ms = 1500
max_call_seconds = 300
