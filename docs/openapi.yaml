openapi: 3.1.0
info:
  title: michoi Agent control plane
  version: "1"
  description: |
    Control plane of a `michoi` Agent: the process that captures the
    PENGUIN0 intercom traffic, arbitrates who owns a call, and injects the
    answer / unlock / hangup packets. Backends (Matter, HomeKit, Home
    Assistant, Homebridge plugins) talk to it over plain HTTP/1.1.

    ## Planes

    * **Control plane** — this document. Requests are REST; the downstream
      event feed is a Server-Sent Events stream (`GET /v1/events`).
    * **Data plane** — RTSP. `GET /v1/media` returns the RTSP URL. Video is
      RTP/JPEG (RFC 2435) and audio is PCMU, both without re-encoding and with
      RTP timestamps, so the two stay in sync. Talk-back uses the ONVIF
      backchannel when the client supports it; `POST /v1/talk` is the
      transitional alternative.

    ## Content negotiation (mandatory)

    * Every request with a body MUST carry `Content-Type`. An unsupported or
      missing type is answered with `415 Unsupported Media Type`.
    * Every request MUST carry `Accept`. REST resources accept
      `application/json`, the event feed accepts `text/event-stream`, the
      snapshot accepts `image/jpeg`. A missing or unsupported `Accept` is
      answered with `406 Not Acceptable` whose body lists the supported
      media types. Quality values and multiple candidates are honoured; the
      first supported candidate in preference order wins.
    * Every response carries `Content-Type`, including error responses.
    * Media types carry the codec version as a parameter
      (`application/json; v=1`). Future encodings such as
      `application/cbor; v=1` are introduced purely by adding candidates to
      `Accept` / `Content-Type`; `GET /v1/` lists what the server supports.

    ## Events and reconnects

    Events carry a monotonically increasing `seq`. The server closes the
    event stream after a random 5–10 minutes; clients reconnect with
    `Last-Event-ID` and receive every event they missed while the sequence
    is still inside the server's ring buffer. When it is not, the stream
    starts with a `snapshot` event so the client can rebuild its state. A
    comment line is sent every 15 s as a heartbeat.

    ## Commands and idempotency

    Every command carries a client-chosen `command_id`. The Agent keeps the
    result of recent commands and replays it when the same `command_id` is
    sent again, so a retried request can never unlock twice.

    ## Authentication

    `Authorization: Bearer <token>` on every request, including the event
    stream. The same token is used for the RTSP data plane. A server started
    without a token (development only) accepts unauthenticated requests.
  license:
    name: MIT OR Apache-2.0

servers:
  - url: http://{host}:{port}
    variables:
      host:
        default: 127.0.0.1
      port:
        default: "8080"

security:
  - bearer: []
  - tokenQuery: []

tags:
  - name: discovery
  - name: call
  - name: events
  - name: media
  - name: monitor
  - name: elevator

paths:
  /v1/:
    get:
      tags: [discovery]
      summary: Server capabilities and supported media types
      operationId: getInfo
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"

  /v1/state:
    get:
      tags: [call]
      summary: Current call state
      operationId: getState
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"

  /v1/events:
    get:
      tags: [events]
      summary: Server-Sent Events feed of call state changes
      operationId: streamEvents
      description: |
        `Accept: text/event-stream` is required. Each SSE message has
        `id:` set to the event `seq`, `event:` set to the event `type`, and
        `data:` holding the JSON `Event` object. The first message is either
        the replay of missed events (when `Last-Event-ID` is inside the ring
        buffer) or a `snapshot` event.
      parameters:
        - in: header
          name: Last-Event-ID
          required: false
          schema:
            type: string
          description: Sequence number of the last event the client processed.
      responses:
        "200":
          description: Event stream
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-cache
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE framing of `Event` objects.
              examples:
                ring:
                  value: |
                    id: 42
                    event: call_started
                    data: {"seq":42,"at_ms":1788470000000,"type":"call_started","session_id":"43179387","door_id":"M00000000000","room_id":"S00000000000"}

        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"

  /v1/call/claim:
    post:
      tags: [call]
      summary: Answer the ringing call as the remote owner
      operationId: claimCall
      requestBody:
        $ref: "#/components/requestBodies/Command"
      responses:
        "200":
          $ref: "#/components/responses/CommandOk"
        "409":
          $ref: "#/components/responses/CommandRejected"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /v1/call/unlock:
    post:
      tags: [call]
      summary: Open the door
      description: |
        Opens the door at any time, like the physical Pad: while idle, while
        the door is ringing (no `claim` needed) or during a call. Rate limited
        by the unlock cooldown (`429`). With `security.unlock_requires_answer`
        enabled on the Agent the strict rule applies instead and only the
        remote owner of an answered call may unlock (`409`).
      operationId: unlockDoor
      requestBody:
        $ref: "#/components/requestBodies/Command"
      responses:
        "200":
          $ref: "#/components/responses/CommandOk"
        "409":
          $ref: "#/components/responses/CommandRejected"
        "429":
          description: Unlock cooldown active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /v1/call/hangup:
    post:
      tags: [call]
      summary: End the current call
      operationId: hangupCall
      requestBody:
        $ref: "#/components/requestBodies/Command"
      responses:
        "200":
          $ref: "#/components/responses/CommandOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /v1/cameras:
    get:
      tags: [monitor]
      summary: List door cameras the Pad may view
      description: |
        The provisioned roster (`intercom.cameras`) with each entry's current
        reachability by UDP 10008 discovery. The protocol has no discovery for
        these; the list is configured, and only reachable ones can be viewed.
      operationId: listCameras
      responses:
        "200":
          description: Camera roster
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CameraInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "406": { $ref: "#/components/responses/NotAcceptable" }

  /v1/monitor:
    post:
      tags: [monitor]
      summary: Start viewing a door camera (no ring)
      description: |
        Open a monitor session (family `00b8`, the mirror of an incoming call)
        to the given camera. Its video and audio then appear on the media
        routes (`/v1/snapshot.jpg`, `/v1/stream.mjpeg`, `/v1/audio.pcm`) exactly
        like a call's, and `monitor_started` / `monitor_stopped` events are
        emitted. Only one monitor runs at a time; a new request replaces it.
        Blocked while a call is active (`409`).
      operationId: startMonitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [camera_id]
              properties:
                camera_id:
                  type: string
                  description: A door station id from the roster.
      responses:
        "200":
          description: Monitor started
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  camera_id: { type: string }
        "409": { $ref: "#/components/responses/CommandRejected" }
        "501":
          description: Not supported in this mode (only the Pad-side Agent monitors)
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /v1/monitor/stop:
    post:
      tags: [monitor]
      summary: Stop the active monitor
      operationId: stopMonitor
      responses:
        "200":
          description: Monitor stopped
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        "409":
          description: No monitor is active
        "401": { $ref: "#/components/responses/Unauthorized" }
        "406": { $ref: "#/components/responses/NotAcceptable" }

  /v1/dial:
    post:
      tags: [call]
      summary: Dial another station (Pad-to-Pad call)
      description: |
        Place an outbound voice+video call to a station by id (resolved over
        UDP 10008). The callee's video and audio then appear on the media
        routes; `POST /v1/talk` (or the talk WebSocket) sends our mic to them.
        `dialing` / `call_connected` / `call_hung_up` events are emitted. Only
        the Pad-side Agent supports this (501 otherwise).
      operationId: dial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [callee_id]
              properties:
                callee_id: { type: string, description: Station id to call }
      responses:
        "200":
          description: Call started
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean }, callee_id: { type: string } }
        "409": { $ref: "#/components/responses/CommandRejected" }
        "501": { description: Not supported in this mode }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /v1/dial/hangup:
    post:
      tags: [call]
      summary: Hang up the active outbound call
      operationId: dialHangup
      responses:
        "200":
          description: Call ended
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        "409": { description: No outbound call is active }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "406": { $ref: "#/components/responses/NotAcceptable" }

  /v1/elevator:
    post:
      tags: [elevator]
      summary: Call the elevator to this Pad's floor
      description: |
        Send an elevator call (`0106/01`) to the door station and wait for its
        acknowledgement. The floor is derived by the controller from the Pad's
        room station id; the request carries no floor. Idempotent by
        `command_id`.
      operationId: callElevator
      requestBody:
        $ref: "#/components/requestBodies/Command"
      responses:
        "200":
          $ref: "#/components/responses/CommandOk"
        "409":
          $ref: "#/components/responses/CommandRejected"
        "501":
          description: Not supported in this mode
        "503":
          description: No acknowledgement from the door
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /v1/snapshot.jpg:
    get:
      tags: [media]
      summary: Most recent door frame
      operationId: getSnapshot
      description: "Requires `Accept: image/jpeg`. Returns the last JPEG the door station sent, unmodified."
      responses:
        "200":
          description: JPEG image
          headers:
            X-Frame-Age-Ms:
              description: Milliseconds since the door station produced this frame, on the Agent's clock. Large values mean the last call ended a while ago.
              schema:
                type: integer
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: No frame received yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"

  /v1/media:
    get:
      tags: [media]
      summary: Where and how to receive the live media
      operationId: getMedia
      responses:
        "200":
          description: Media description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"

  /v1/talk:
    post:
      tags: [media]
      summary: Send talk-back audio to the door station
      operationId: postTalk
      description: |
        Transitional talk-back path for clients without an RTSP backchannel.
        The body is raw PCM S16LE, 8 kHz, mono, sent with
        `Transfer-Encoding: chunked` for as long as the caller speaks. Audio is
        forwarded only while the remote owner has the call; otherwise the
        request is rejected with `409`.
      requestBody:
        required: true
        content:
          "audio/L16; rate=8000; channels=1":
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Audio accepted until the body ended
        "409":
          $ref: "#/components/responses/CommandRejected"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /v1/stream.mjpeg:
    get:
      tags: [media]
      summary: Live door video as MJPEG (multipart/x-mixed-replace)
      operationId: streamMjpeg
      description: |
        Browser-friendly live picture: the latest frame is sent first, then
        every new door frame as its own part with `X-Pts-Us`. Meant for the
        built-in Pad page, `<img>` tags, go2rtc and ffmpeg; the RTSP data
        plane remains the synchronised, standard path. Accept must allow
        `multipart/x-mixed-replace` or `image/jpeg` (browsers send `*/*`).
      responses:
        "200":
          description: MJPEG stream, one JPEG per part
          content:
            multipart/x-mixed-replace:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"

  /v1/audio.pcm:
    get:
      tags: [media]
      summary: Live door audio as raw L16 (chunked)
      operationId: streamAudio
      description: |
        Big-endian 16-bit mono 8 kHz PCM, as `audio/L16` mandates, streamed
        with chunked transfer encoding until the client closes. No
        timestamps; pairs with `/v1/stream.mjpeg` for the Pad page.
      responses:
        "200":
          description: PCM stream
          content:
            "audio/L16; rate=8000; channels=1":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"

  /v1/talk.ws:
    get:
      tags: [media]
      summary: Talk-back over WebSocket (browser path)
      operationId: talkWebSocket
      description: |
        HTTP/1.1 cannot stream a request body from a browser, so the Pad page
        sends microphone audio here: after the standard WebSocket upgrade,
        every binary message carries PCM S16LE 8 kHz mono. The same
        exclusivity as `POST /v1/talk` applies; a rejected chunk closes the
        socket after a text message with a `CommandResult`. Authenticate with
        `?token=` (WebSocket clients cannot set headers).
      responses:
        "101":
          description: Switching Protocols
        "400":
          description: Not a WebSocket upgrade
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/CommandRejected"

  /pad:
    get:
      tags: [discovery]
      summary: Built-in browser Pad
      operationId: getPad
      security: []
      description: |
        A single self-contained page (no external assets) that behaves like
        the physical room station: ring alert, live picture and sound,
        answer, unlock, hang up and hold-to-talk. It stores the bearer token
        in the browser and uses `?token=` for `EventSource`, `<img>` and the
        talk WebSocket. `/` redirects here. Optional: served only while the
        Agent's web UI is enabled (`agent.web_ui`, on by default); 404 otherwise.
      responses:
        "200":
          description: HTML page
          content:
            text/html:
              schema:
                type: string

  /openapi.yaml:
    get:
      tags: [discovery]
      summary: This document
      operationId: getOpenApi
      security: []
      responses:
        "200":
          description: OpenAPI document
          content:
            application/yaml:
              schema:
                type: string

  /swagger:
    get:
      tags: [discovery]
      summary: Swagger UI (only when enabled on the server)
      operationId: getSwagger
      security: []
      responses:
        "200":
          description: HTML page rendering `/openapi.yaml`
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Swagger UI disabled

  /v1/talk-video.ws:
    get:
      tags: [media]
      summary: Send the browser camera to the far end of an outbound call
      description: |
        WebSocket upgrade; each binary message is one JPEG frame. During an
        active outbound call (`POST /v1/dial`) the frames are fragmented and
        sent to the callee as `00b7/0a` video. Ignored when no call is active.
        Authenticate with `?token=` (WebSocket clients cannot set headers).
      operationId: talkVideoWebSocket
      responses:
        "101": { description: Switching Protocols }
        "400": { description: Not a WebSocket upgrade }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    tokenQuery:
      type: apiKey
      in: query
      name: token
      description: Same token as the bearer scheme, for clients that cannot set headers (EventSource, img, WebSocket).

  requestBodies:
    Command:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommandRequest"

  responses:
    CommandOk:
      description: Command accepted (or replayed from the idempotency cache)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommandResult"
    CommandRejected:
      description: The call state does not allow this command
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommandResult"
    BadRequest:
      description: Malformed body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or wrong bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotAcceptable:
      description: No supported media type in `Accept`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NegotiationError"
    UnsupportedMediaType:
      description: Request `Content-Type` not supported
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NegotiationError"

  schemas:
    ApiInfo:
      type: object
      required: [api_version, agent_id, media_types, capabilities]
      properties:
        api_version:
          type: string
          example: "1"
        agent_id:
          type: string
          example: fake-pad-cap
        media_types:
          type: array
          description: Media types the server can produce and consume, with codec version parameters.
          items:
            type: string
          example: ["application/json; v=1", "text/event-stream", "image/jpeg"]
        capabilities:
          type: array
          items:
            type: string
          example: ["events", "snapshot", "rtsp", "talk"]

    CallPhase:
      type: string
      enum: [idle, ringing, connected, ending]

    Owner:
      type: string
      enum: [none, pad, remote]

    CallState:
      type: object
      required: [phase, owner, agent_id, connected, uptime_ms]
      properties:
        phase:
          $ref: "#/components/schemas/CallPhase"
        owner:
          $ref: "#/components/schemas/Owner"
        session_id:
          type: [string, "null"]
          description: Current call session, as a decimal string (64-bit safe).
        door_id:
          type: [string, "null"]
        room_id:
          type: [string, "null"]
        since_ms:
          type: [integer, "null"]
          description: Unix time in milliseconds the phase was entered.
        agent_id:
          type: string
        connected:
          type: boolean
          description: Whether the Agent currently sees the intercom link.
        uptime_ms:
          type: integer

    Event:
      type: object
      required: [seq, at_ms, type]
      properties:
        seq:
          type: integer
          format: int64
        at_ms:
          type: integer
          format: int64
          description: Unix time in milliseconds.
        type:
          type: string
          enum: [snapshot, call_started, pad_answered, remote_answered, unlocked, call_ended, agent_error]
        state:
          $ref: "#/components/schemas/CallState"
          description: Present on `snapshot`.
        session_id:
          type: string
          description: Present on call events.
        door_id:
          type: string
        room_id:
          type: string
        reason:
          type: string
          description: Present on `call_ended`.
        by:
          $ref: "#/components/schemas/Owner"
          description: Present on `unlocked`.
        message:
          type: string
          description: Present on `agent_error`.

    CameraInfo:
      type: object
      properties:
        station_id: { type: string, description: Door camera station id }
        ip: { type: string, description: Resolved IPv4 when reachable }
        reachable: { type: boolean }
      required: [station_id, reachable]
    CommandRequest:
      type: object
      required: [command_id]
      properties:
        command_id:
          type: string
          description: Client-chosen idempotency key, unique per backend.
          example: hap-1788470000-17

    CallError:
      type: string
      enum: [not_ringing, pad_owns_call, unlock_not_allowed, unlock_cooldown, no_call, agent_offline]

    CommandResult:
      type: object
      required: [command_id, ok]
      properties:
        command_id:
          type: string
        ok:
          type: boolean
        error:
          $ref: "#/components/schemas/CallError"
        replayed:
          type: boolean
          description: True when the result came from the idempotency cache.

    MediaInfo:
      type: object
      required: [video, audio]
      properties:
        rtsp_url:
          type: [string, "null"]
          example: rtsp://192.168.124.1:8554/door
          description: Absent while the RTSP data plane is not running.
        video:
          type: object
          required: [codec, width, height]
          properties:
            codec:
              type: string
              const: jpeg
            width:
              type: integer
            height:
              type: integer
        audio:
          type: object
          required: [codec, sample_rate, channels]
          properties:
            codec:
              type: string
              enum: [pcmu, pcm_s16le]
            sample_rate:
              type: integer
              const: 8000
            channels:
              type: integer
              const: 1
        talk:
          type: boolean
          description: Whether talk-back is accepted right now.
        history_ms:
          type: integer
          description: Configured pre-roll buffer window (media.history_secs); 0 means no buffering.
        buffered_ms:
          type: integer
          description: Span of video/audio currently held in the pre-roll buffer.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string

    NegotiationError:
      type: object
      required: [error, supported]
      properties:
        error:
          type: string
          enum: [not_acceptable, unsupported_media_type]
        supported:
          type: array
          items:
            type: string
